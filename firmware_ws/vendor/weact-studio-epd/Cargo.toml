# The published 0.1.3 manifest, kept as it shipped, without the registry's
# normalization notes. This copy exists for the one patch in ../README.md.

[package]
edition = "2021"
name = "weact-studio-epd"
version = "0.1.3"
authors = ["Alexander van Saase <avsaase@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Unofficial driver for WeAct Studio E-paper modules"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avsaase/weact-studio-epd"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
blocking = []
default = ["graphics"]
graphics = ["dep:embedded-graphics"]

[lib]
name = "weact_studio_epd"
path = "src/lib.rs"

[dependencies.display-interface]
version = "0.5.0"

[dependencies.embedded-graphics]
version = "0.8.1"
optional = true

[dependencies.embedded-hal]
version = "1.0.0"

[dependencies.embedded-hal-async]
version = "1.0.0"

[dependencies.maybe-async-cfg]
version = "0.2.3"

[dependencies.sealed]
version = "0.5.0"
