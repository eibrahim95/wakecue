[package]
edition      = "2024"
name         = "wakecue"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "wakecue"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c3", "unstable"] }
esp-storage = { version = "0.10.0", features = ["esp32c3"] }
lamp-core = { path = "../core" }


defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c3"] }

critical-section = "1.2.0"

# The phone setup: the lamp raises its own Wi-Fi network and answers DHCP on it. All of it is only
# started when the owner picks "Phone setup" in the menu, so the normal wake-and-sleep path never
# touches the radio.
esp-rtos = { version = "0.4.0", features = ["defmt", "embassy", "esp-alloc", "esp-radio", "esp32c3"] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32c3"] }
esp-radio = { version = "1.0.0-beta.1", features = ["defmt", "esp-alloc", "esp32c3", "unstable", "wifi"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "medium-ethernet", "proto-ipv4", "udp"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
static_cell = "2.1.1"
esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "esp32c3",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c3"] }
weact-studio-epd = { version = "0.1.3", default-features = false, features = ["blocking", "graphics"] }
embedded-graphics = "0.8.2"
display-interface = "0.5.0"

# One local method added to the driver: `assume_image_on_panel`, so a wake from deep sleep can
# redraw the clock with the fast waveform instead of a two-second full refresh. See
# `../vendor/README.md`.
[patch.crates-io]
weact-studio-epd = { path = "../vendor/weact-studio-epd" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
