# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

# No `--after watchdog-reset` in this runner. With `--monitor` espflash keeps the port it just
# opened, and the watchdog reset starts the app, whose USB-Serial-JTAG re-enumerates and kills
# that handle: the command dies with `I/O error` after a successful flash. A board that is
# asleep or sitting in the bootloader is reached with `just flash` (watchdog reset, no
# monitor); once the app is up with DEV_MODE, this runner is the one to use.
[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3 --log-format defmt"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["core"]
